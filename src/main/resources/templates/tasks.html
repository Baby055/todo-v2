<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des tâches</title>
</head>
<body>
<h1>Liste des tâches</h1>

<div th:if="${error}">
    <p style="color: red" th:text="${error}">Erreur</p>
</div>

<div th:if="${#lists.isEmpty(todosList)}">
    <span>Aucune tâche trouvée, voulez-vous en créer une ?</span>
</div>

<table>
    <thead>
        <tr>
            <th>Titre</th>
            <th>Description</th>
            <th>Statut</th>
            <th>Mettre à jour</th>
            <th>Supprimer</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="task : ${todosList}">
            <td th:text="${task.title}">Titre</td>
            <td th:text="${task.description}">Description</td>
            <td>
                <span th:text="${task.completed} ? 'Terminé' : 'À faire'">Statut</span>
                <form th:action="@{/tasks/{id}/toggle(id=${task.id})}" method="post">
                    <button type="submit">Changer le statut</button>
                </form>
            </td>
            <td>
                <form th:action="@{/tasks/{id}/update(id=${task.id})}" method="post">
                    <div>
                        <input type="text" name="title" placeholder="Titre" th:value="${task.title}" required />
                    </div>
                    <div>
                        <input type="text" name="description" placeholder="Description" th:value="${task.description}" />
                    </div>
                    <button type="submit">Mettre à jour</button>
                </form>
            </td>
            <td>
                <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post">
                    <button type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

<form th:action="@{/tasks/create}" method="post">
    <div>
        <label for="new-title">Titre : </label>
        <input type="text" id="new-title" name="title" placeholder="Titre" required />
    </div>
    <div>
        <label for="new-description">Description : </label>
        <input type="text" id="new-description" name="description" placeholder="Description" />
    </div>
    <button type="submit">Créer</button>
</form>

<form method="POST" th:action="@{/logout}">
    <button type="submit">Déconnexion</button>
</form>
</body>
</html>
